<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock - Multiple Time Zones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🕐 Global Time Clock</h1>
      <p class="subtitle">Track time across multiple time zones</p>
    </header>

    <div class="controls">
      <div class="add-timezone">
        <select id="timezoneSelect" class="timezone-dropdown">
          <option value="">Select a timezone to add...</option>
        </select>
        <button id="addBtn" class="btn-add">+ Add</button>
      </div>
      <button id="resetBtn" class="btn-reset">Reset to Default</button>
    </div>

    <div id="clocksContainer" class="clocks-container"></div>

    <div class="info-section">
      <h3>💡 How to use:</h3>
      <ul>
        <li>Select a timezone from the dropdown and click Add to display it</li>
        <li>Click the X button on any clock to remove it</li>
        <li>Times update in real-time</li>
        <li>Use Reset to restore default timezones</li>
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
